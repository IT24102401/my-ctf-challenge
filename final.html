<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>elianthrus.sveyne</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,440&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181c;
    --ink-deep:#0e1114;
    --paper:#f2ede4;
    --accent:#c98f4b;
    --muted:#8a95a1;
    --line:rgba(242,237,228,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    position:relative;
    background:
      radial-gradient(80% 60% at 15% 0%, #1b2128 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 24px;
    overflow-x:hidden;
  }

  /* atmospheric scene layer, recreated to stand in for the original css/styles.css scene-bg */
  .scene-bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(60% 40% at 80% 10%, rgba(201,143,75,0.08), transparent 60%),
      radial-gradient(70% 50% at 10% 90%, rgba(60,90,110,0.16), transparent 60%),
      linear-gradient(180deg, #0b0d10 0%, #14181c 55%, #0c0f12 100%);
  }
  .mist{
    position:fixed;
    inset:-10% -10%;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(45% 30% at 20% 30%, rgba(242,237,228,0.05), transparent 70%),
      radial-gradient(55% 35% at 75% 70%, rgba(242,237,228,0.04), transparent 70%);
    filter:blur(30px);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ transform:translate3d(0,0,0); }
    100%{ transform:translate3d(2%, -1.5%, 0); }
  }
  #fireflies{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    width:100%;
    height:100%;
  }

  .wrap{
    position:relative;
    z-index:3;
    width:100%;
    max-width:400px;
  }
  .mark{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--accent);
    margin-bottom:22px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:440;
    font-size:2.6rem;
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 14px 0;
    color:var(--paper);
  }
  h1 .dim{ color:var(--muted); font-weight:340; }
  .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:440;
    font-size:1.05rem;
    line-height:1.5;
    color:#c9cdd2;
    max-width:34ch;
    margin:0 0 46px 0;
  }
  .links{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line);
  }
  .links a{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:18px 2px;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    text-decoration:none;
    font-size:1rem;
  }
  .links a .label{
    font-weight:500;
  }
  .links a .go{
    font-family:'Fraunces', serif;
    font-style:italic;
    color:var(--muted);
    font-size:0.92rem;
    transition:color .2s ease, transform .2s ease;
  }
  .links a:hover .go, .links a:focus-visible .go{
    color:var(--accent);
    transform:translateX(3px);
  }
  .links a.primary .label{ color:var(--paper); }
  .links a.primary{
    background:linear-gradient(90deg, rgba(201,143,75,0.10), transparent);
  }
  .links a.quiet{ color:var(--muted); }
  .links a.quiet .label{ font-weight:400; }
  a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }

  .foot{
    margin-top:40px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:0.78rem;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .links a .go{ transition:none; }
  }
</style>
</head>
<body>
<div class="scene-bg"></div>
<div class="mist"></div>
<canvas id="fireflies"></canvas>
<div class="wrap">
  <span class="mark"></span>
  <h1>elian<span class="dim">.sveyne</span></h1>
  <p class="tagline">I kept the quiet parts where the light lands longest.</p>

  <nav class="links">
    <a class="primary" href="https://www.instagram.com/elian.sveyne/" target="_blank" rel="noopener">
      <span class="label">Instagram</span>
      <span class="go">open →</span>
    </a>
    <a class="quiet" href="#" aria-disabled="true" onclick="return false;">
      <span class="label">Portfolio</span>
      <span class="go">soon</span>
    </a>
    <a class="quiet" href="#" aria-disabled="true" onclick="return false;">
      <span class="label">Notes</span>
      <span class="go">soon</span>
    </a>
  </nav>

  <div class="foot">
    <span>@elian.sveyne</span>
    <span>1 / 3 live</span>
  </div>
</div>
<script>
(function(){
  var canvas = document.getElementById('fireflies');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, flies = [];
  var COUNT = 28;

  function resize(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeFly(){
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.6 + Math.random() * 1.6,
      baseAlpha: 0.25 + Math.random() * 0.55,
      speedX: (Math.random() - 0.5) * 0.12,
      speedY: (Math.random() - 0.5) * 0.10,
      phase: Math.random() * Math.PI * 2,
      flicker: 0.015 + Math.random() * 0.02
    };
  }

  function init(){
    resize();
    flies = [];
    for (var i = 0; i < COUNT; i++) flies.push(makeFly());
  }

  function tick(t){
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < flies.length; i++){
      var f = flies[i];
      f.x += f.speedX;
      f.y += f.speedY;
      f.phase += f.flicker;

      if (f.x < -10) f.x = w + 10;
      if (f.x > w + 10) f.x = -10;
      if (f.y < -10) f.y = h + 10;
      if (f.y > h + 10) f.y = -10;

      var alpha = f.baseAlpha * (0.5 + 0.5 * Math.sin(f.phase));
      var glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 6);
      glow.addColorStop(0, 'rgba(201,143,75,' + alpha + ')');
      glow.addColorStop(1, 'rgba(201,143,75,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(242,237,228,' + Math.min(alpha + 0.15, 1) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(tick);
  }

  try {
    init();
    window.addEventListener('resize', init);
    if (reduceMotion){
      tick(0);
    } else {
      requestAnimationFrame(tick);
    }
  } catch (e) {
    // fail silently, page still works without the effect
  }
})();
</script>
</body>
</html>
