<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avalon — The Fallen City</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a1614;
    --deep-water:#10241f;
    --verdigris:#3c6e5e;
    --moonlight:#cfd8d3;
    --brass:#b08d4f;
    --ember:#7a2e2e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--void);
    font-family:'Work Sans', sans-serif;
    color:var(--moonlight);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background-image:
      linear-gradient(180deg, rgba(6,10,9,0.55) 0%, rgba(6,10,9,0.35) 40%, rgba(6,10,9,0.75) 100%),
      url('avalon_bg.png');
    background-size:cover;
    background-position:center;
  }
  /* drifting mist layers, sits above the photo, below the fireflies */
  .mist{
    position:absolute; inset:-10%;
    background-image:
      radial-gradient(ellipse 60% 30% at 30% 60%, rgba(207,216,211,0.06), transparent 70%),
      radial-gradient(ellipse 50% 25% at 75% 40%, rgba(207,216,211,0.05), transparent 70%);
    animation: drift 40s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    from{ transform: translateX(-2%) translateY(0); }
    to{ transform: translateX(2%) translateY(-1%); }
  }
  @media (prefers-reduced-motion: reduce){
    .mist{ animation:none; }
  }
  #fireflies{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding:2rem;
  }

  /* the rune circle / key progress ring */
  .ring-holder{ position:relative; width:190px; height:190px; margin-bottom:-58px; z-index:2; }
  .ring-holder svg{ width:100%; height:100%; }
  .ring-crest{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:0.72rem; letter-spacing:0.04em; color:rgba(207,216,211,0.55);
  }

  .card{
    position:relative; z-index:1;
    width:min(380px, 88vw);
    padding:4.5rem 2.6rem 2.4rem;
    background: linear-gradient(180deg, rgba(9,20,18,0.85), rgba(6,14,12,0.9));
    backdrop-filter: blur(6px);
    border:1px solid rgba(176,141,79,0.28);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 30px 70px -20px rgba(0,0,0,0.8),
      0 0 60px -20px rgba(120,170,255,0.2);
  }
  .card::before{
    content:""; position:absolute; inset:9px;
    border:1px solid rgba(176,141,79,0.12);
    pointer-events:none;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:2.1rem;
    letter-spacing:0.01em;
    margin:0 0 0.15rem;
    text-align:center;
    color:#e4e6e0;
  }
  .sub{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.98rem;
    color:var(--verdigris);
    margin:0 0 2.2rem;
    filter:brightness(1.6);
  }

  label{
    display:block;
    font-size:0.68rem;
    letter-spacing:0.06em;
    color:rgba(207,216,211,0.5);
    margin-bottom:0.4rem;
  }
  .field{ margin-bottom:1.15rem; }
  input{
    width:100%;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(207,216,211,0.14);
    border-bottom:1px solid rgba(176,141,79,0.4);
    color:var(--moonlight);
    font-family:'Work Sans', sans-serif;
    font-size:0.92rem;
    padding:0.65rem 0.7rem;
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  input::placeholder{ color:rgba(207,216,211,0.25); }
  input:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 1px rgba(176,141,79,0.15), 0 0 18px -4px rgba(176,141,79,0.35);
  }

  button{
    width:100%;
    margin-top:0.9rem;
    padding:0.75rem 1rem;
    background:transparent;
    border:1px solid var(--brass);
    color:#e8d9b5;
    font-family:'Work Sans', sans-serif;
    font-size:0.78rem;
    letter-spacing:0.09em;
    cursor:pointer;
    position:relative;
    transition:background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
  }
  button:hover{
    background:rgba(176,141,79,0.1);
    box-shadow:0 0 24px -6px rgba(176,141,79,0.5);
    color:#fff3d6;
  }
  button:active{ transform:translateY(1px); }

  .foot{
    margin-top:1.6rem;
    text-align:center;
    font-size:0.72rem;
    color:rgba(207,216,211,0.35);
  }
  .foot a{ color:var(--verdigris); text-decoration:none; border-bottom:1px dotted rgba(60,110,94,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="mist"></div>
  <canvas id="fireflies"></canvas>
  <div class="wrap">

    <div class="ring-holder">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(176,141,79,0.15)" stroke-width="1"/>
        <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(60,110,94,0.25)" stroke-width="1" stroke-dasharray="2 5"/>
        <!-- six key marks, evenly spaced, 3 lit / 3 dim -->
        <g id="keys" fill="none" stroke-width="2" stroke-linecap="round">
          <line x1="100" y1="14" x2="100" y2="28" stroke="#b08d4f"/>
          <line x1="164.4" y1="35.6" x2="155.3" y2="45.1" stroke="#b08d4f"/>
          <line x1="186" y1="100" x2="172" y2="100" stroke="#b08d4f"/>
          <line x1="164.4" y1="164.4" x2="155.3" y2="154.9" stroke="rgba(207,216,211,0.18)"/>
          <line x1="100" y1="186" x2="100" y2="172" stroke="rgba(207,216,211,0.18)"/>
          <line x1="35.6" y1="164.4" x2="44.7" y2="154.9" stroke="rgba(207,216,211,0.18)"/>
        </g>
      </svg>
      <div class="ring-crest">III&nbsp;/&nbsp;VI</div>
    </div>

    <div class="card">
      <h1>Avalon</h1>
      <p class="sub">the mist remembers what the city forgot</p>

      <form onsubmit="return false;">
        <div class="field">
          <label for="u">NAME</label>
          <input id="u" type="text" placeholder="who seeks the city" autocomplete="username">
        </div>
        <div class="field">
          <label for="p">PASSPHRASE</label>
          <input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit">Cross the Water</button>
      </form>

      <div class="foot">no passage yet? <a href="#">be named among the seekers</a></div>
    </div>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('fireflies');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var palette = [
    'rgba(255,214,130,ALPHA)',  // warm brass/lantern
    'rgba(255,236,190,ALPHA)',  // pale candle
    'rgba(160,210,255,ALPHA)'   // cool blue spire-light, sparser
  ];

  var COUNT = Math.min(90, Math.floor((window.innerWidth * window.innerHeight) / 12000));

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function makeFly(){
    return {
      x: rand(0, canvas.width),
      y: rand(canvas.height * 0.25, canvas.height),
      r: rand(0.6, 1.8),
      baseAlpha: rand(0.25, 0.85),
      phase: rand(0, Math.PI * 2),
      flickerSpeed: rand(0.01, 0.035),
      driftX: rand(-0.08, 0.08),
      driftY: rand(-0.12, -0.02),
      swaySpeed: rand(0.002, 0.008),
      swayAmp: rand(4, 18),
      swayPhase: rand(0, Math.PI * 2),
      color: palette[Math.random() < 0.15 ? 2 : (Math.random() < 0.5 ? 0 : 1)]
    };
  }

  var flies = [];
  for (var i = 0; i < COUNT; i++) flies.push(makeFly());

  var t = 0;

  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < flies.length; i++){
      var f = flies[i];
      f.phase += f.flickerSpeed;
      var flicker = (Math.sin(f.phase) + 1) / 2;      // 0..1
      var alpha = f.baseAlpha * (0.35 + 0.65 * flicker);

      f.x += f.driftX + Math.sin(t * f.swaySpeed + f.swayPhase) * 0.02;
      f.y += f.driftY;

      if (f.y < -10){ f.y = canvas.height + 10; f.x = rand(0, canvas.width); }
      if (f.x < -10) f.x = canvas.width + 10;
      if (f.x > canvas.width + 10) f.x = -10;

      var col = f.color.replace('ALPHA', alpha.toFixed(3));
      var glowCol = f.color.replace('ALPHA', (alpha * 0.35).toFixed(3));

      ctx.beginPath();
      ctx.fillStyle = glowCol;
      ctx.arc(f.x, f.y, f.r * 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = col;
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    t += 1;
    if (!reduceMotion) requestAnimationFrame(draw);
  }

  if (reduceMotion){
    // draw one static frame so the scene still has fireflies, just not moving
    draw();
  } else {
    requestAnimationFrame(draw);
  }
})();
</script>
</body>
</html>
